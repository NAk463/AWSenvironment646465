[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "awsemu"
version = "0.1.0"
description = "AWS CLI/SDK compatible local emulator for S3, SQS, DynamoDB and STS (stdlib only)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "boto3"]

[project.scripts]
awsemu = "awsemu.__main__:main"

[tool.setuptools.packages.find]
include = ["awsemu*"]

[tool.setuptools.package-data]
awsemu = ["models/*.json"]
